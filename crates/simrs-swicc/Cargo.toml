[package]
name        = "simrs-swicc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "swICC PC/SC virtual reader -- boots a simrs SIM and serves APDUs over TCP"
publish     = false

[[bin]]
name = "simrs-swicc"
path = "src/main.rs"

[dependencies]
simrs-sim          = { workspace = true, features = ["gsm", "usim"] }
simrs-gsm          = { workspace = true }
simrs-usim         = { workspace = true }
simrs-milenage     = { workspace = true }
simrs-fs           = { workspace = true }
simrs-transport    = { workspace = true }
simrs-transport-tcp = { workspace = true }
clap               = { workspace = true }

[lints]
workspace = true
