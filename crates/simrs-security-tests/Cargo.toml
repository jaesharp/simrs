[package]
name        = "simrs-security-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Security regression and PoC test suite for simrs"
publish     = false

[lib]
crate-type = ["rlib"]

[dependencies]
simrs-sim      = { workspace = true, features = ["usim", "gsm"] }
simrs-usim     = { workspace = true }
simrs-gsm      = { workspace = true }
simrs-fs       = { workspace = true }
simrs-pin      = { workspace = true, features = ["std"] }
simrs-iso7816  = { workspace = true }
simrs-milenage = { workspace = true }
simrs-comp128  = { workspace = true }
simrs-proactive = { workspace = true }
simrs-ota      = { workspace = true }
simrs-ecies    = { workspace = true }
simrs-kdf      = { workspace = true }
simrs-secret   = { workspace = true }

[dev-dependencies]
cucumber = { workspace = true }
tokio    = { workspace = true }
futures  = { workspace = true }

[[test]]
name    = "cucumber"
harness = false

[lints]
workspace = true
