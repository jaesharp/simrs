[package]
name        = "simrs-snapshot"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic SIM state serialization for snapshot fuzzing -- no_std"

[features]
default = []

# `simrs-snapshot` is a foundation leaf crate: it defines the
# `Snapshot` opaque type, `Snapshotable` trait, `SnapshotError`,
# and producer-tag registry. It does NOT depend on any consumer
# crate, because consumers depend on it. Each crate that has
# snapshotable types implements `Snapshotable` in its own
# snapshot module.
[dependencies]

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
