[package]
name        = "simrs-snapshot"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic SIM state serialization for snapshot fuzzing -- no_std"

[features]
default = []

[dependencies]
simrs-sim      = { workspace = true }
simrs-milenage = { workspace = true }

[dev-dependencies]
simrs-sim    = { workspace = true, features = ["gsm", "usim"] }
simrs-fs     = { workspace = true }
simrs-gsm    = { workspace = true }
simrs-usim   = { workspace = true }
simrs-secret = { workspace = true }
proptest     = { workspace = true }

[lints]
workspace = true
