[package]
name = "simrs-interposer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "APDU interposer/proxy/shadow SIM with PCAP capture"

[[bin]]
name = "simrs-interposer"
path = "src/main.rs"

[features]
default = ["redact-secrets-in-logs"]
redact-secrets-in-logs = ["simrs-redact/redact-secrets-in-logs"]

[dependencies]
simrs-redact        = { workspace = true }
simrs-secret        = { workspace = true }
simrs-pcap          = { workspace = true }
simrs-transport     = { workspace = true }
simrs-transport-tcp = { workspace = true }
simrs-sim           = { workspace = true, features = ["usim", "gsm"] }
simrs-milenage      = { workspace = true }
simrs-fs            = { workspace = true }
simrs-gsm           = { workspace = true }
simrs-usim          = { workspace = true }

[lints]
workspace = true
