[package]
name        = "simrs-usim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "3GPP USIM application layer (Milenage auth, FCP, TERMINAL PROFILE) -- no_std"

[features]
default = ["profile-standard"]

# Profile tiers (additive: full includes standard includes minimal)
# DF_5GS (19 EFs) is included in all tiers.
profile-minimal  = []   # LTE attach minimum (33 EFs, FsData<1024, 40>)
profile-standard = []   # Baseline USIM + SMS + 5GS (58 EFs, FsData<4096, 80>)
profile-full     = ["profile-standard"]  # Full TS 31.102 catalog (207 EFs, FsData<16384, 290>)

# Application ADFs (additive)
isim  = []   # ADF.ISIM per TS 31.103 (~10 EFs)
hpsim = []   # ADF.HPSIM per TS 31.104 (~5 EFs)

# GBA (Generic Bootstrapping Architecture) per TS 33.220
gba = []     # Adds AUTHENTICATE P2=0x82/0x84 and NAF key derivation (~50 bytes)

# DF population (additive)
telecom = []  # Populate DF_TELECOM per ETSI TS 102 221 (~12 EFs)

# Meta flags -- convenient feature sets
profile-lte  = ["profile-standard"]
profile-5g   = ["profile-standard"]
profile-ims  = ["profile-full", "isim"]
profile-all  = ["profile-full", "isim", "hpsim", "telecom", "gba"]

# Constant-time validation (DudeCT) -- dev/test only
ct-validation = []

[dependencies]
simrs-iso7816   = { workspace = true }
simrs-bertlv    = { workspace = true }
simrs-milenage  = { workspace = true }
simrs-fs        = { workspace = true }
simrs-pin       = { workspace = true }
simrs-proactive = { workspace = true }
simrs-ecies     = { workspace = true }
simrs-kdf       = { workspace = true }
simrs-redact    = { workspace = true }
simrs-secret    = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
simrs-consttime-validation = { workspace = true }

[lints]
workspace = true
