[package]
name        = "simrs-gp-scp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GlobalPlatform SCP01/SCP02/SCP03 secure channel protocols -- no_std, no_alloc"

[features]
default = []
std     = []
# Constant-time validation (tacet Bayesian timing analysis) -- dev/test only.
# Marker that gates the `ct_validation` test module; the actual
# `simrs-consttime-validation` dev-dep is always linked at test time.
ct-validation = []

[dependencies]
simrs-des         = { workspace = true }
simrs-rijndael    = { workspace = true }
simrs-iso9797     = { workspace = true }
simrs-gp-keys     = { workspace = true }
simrs-consttime   = { workspace = true }
simrs-secret      = { workspace = true }
simrs-apdu-schema = { workspace = true }

[dev-dependencies]
proptest                   = { workspace = true }
simrs-consttime-validation = { workspace = true }
simrs-iso7816              = { workspace = true }

[lints]
workspace = true
