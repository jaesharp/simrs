[package]
name        = "simrs-gp-card"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GlobalPlatform card: top-level event-driven card type parallel to simrs-sim -- no_std, no_alloc"

[features]
default = []
std     = []
sim     = ["dep:simrs-sim", "dep:simrs-milenage"]

[dependencies]
simrs-card-api = { workspace = true }
simrs-gp-open  = { workspace = true }
simrs-gp-keys  = { workspace = true }
simrs-iso7816  = { workspace = true, features = ["alloc"] }
simrs-jcre     = { workspace = true }
simrs-sim      = { workspace = true, features = ["usim", "gp-applet"], optional = true }
simrs-milenage = { workspace = true, optional = true }

[dev-dependencies]
proptest       = { workspace = true }
simrs-milenage = { workspace = true }
simrs-fs       = { workspace = true }
simrs-gp-scp   = { workspace = true }

[lints]
workspace = true
