[package]
name        = "simrs-jcasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Java Card assembler, CAP builder, and test DSL for JCVM security testing"

[lib]
proc-macro = true

[dependencies]
proc-macro2        = "1"
syn                = { version = "2", features = ["full", "extra-traits"] }
quote              = "1"
simrs-jccompile    = { workspace = true }
simrs-jcvm-opcodes = { workspace = true }

[dev-dependencies]
simrs-jcvm = { workspace = true }
proptest   = { workspace = true }

[lints]
workspace = true
