[package]
name        = "simrs-jcvm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JavaCard Virtual Machine bytecode interpreter -- no_std, no_alloc"

[features]
default = []
std     = []
# Gates the *public* introspection surface (the `Hypervisor` trait and
# its `impl Hypervisor for JcVM`, plus the inherent accessors
# `opcode_counts`, `total_instructions`, `max_frame_depth`,
# `reset_controlplane_counters`). The underlying counter fields and
# their dispatch-loop updates are unconditional: observation is the
# "null hypervisor" default, no paravirtualisation required. This
# feature only controls whether downstream crates can see the
# counters.
controlplane-hooks = []
# Gates the `Snapshotable` impl on `JcVM` (and the opaque `Snapshot`
# producer/consumer surface from the `simrs-snapshot` crate). The
# underlying byte serialization (`save_state_internal` /
# `restore_state_internal`) is `pub(crate)` and always compiled --
# only the *opaque, public* snapshot surface is gated. Production
# builds don't enable this feature; test/fuzz builds do.
# See docs/adrs/0001-snapshot-architecture.md.
snapshot = ["dep:simrs-snapshot"]

[dependencies]
simrs-jcvm-opcodes = { workspace = true }
simrs-jcre    = { workspace = true }
simrs-consttime = { workspace = true }
simrs-iso7816 = { workspace = true }
simrs-snapshot = { workspace = true, optional = true }

[dev-dependencies]
proptest       = { workspace = true }
simrs-snapshot = { workspace = true }

[lints]
workspace = true
