[workspace]
members = [
    "crates/simrs-consttime-macros",
    "crates/simrs-consttime",
    "crates/simrs-des",
    "crates/simrs-iso7816",
    "crates/simrs-card-api",
    "crates/simrs-apdu-schema",
    "crates/simrs-bertlv",
    "crates/simrs-rijndael",
    "crates/simrs-comp128",
    "crates/simrs-keccak",
    "crates/simrs-sha256",
    "crates/simrs-sha1",
    "crates/simrs-md5",
    "crates/simrs-bignum",
    "crates/simrs-rsa",
    "crates/simrs-iso9797",
    "crates/simrs-gp-keys",
    "crates/simrs-gp-scp",
    "crates/simrs-jcre",
    "crates/simrs-jcasm",
    "crates/simrs-jccompile",
    "crates/simrs-jcasm-jacc",
    "crates/simrs-jcvm",
    "crates/simrs-gp-open",
    "crates/simrs-gp-card",
    "crates/simrs-jcop-profile",
    "crates/simrs-kdf",
    "crates/simrs-ecies",
    "crates/simrs-milenage",
    "crates/simrs-tuak",
    "crates/simrs-fs",
    "crates/simrs-pin",
    "crates/simrs-proactive",
    "crates/simrs-gsm",
    "crates/simrs-usim",
    "crates/simrs-sim",
    "crates/simrs-transport",
    "crates/simrs-transport-tcp",
    "crates/simrs-transport-shmem",
    "crates/simrs-transport-virtio",
    "crates/simrs-t0",
    "crates/simrs-qemu",
    "crates/simrs-peripheral",
    "crates/simrs-peripheral-shannon",
    "crates/simrs-peripheral-osembed",
    "crates/simrs-snapshot",
    "crates/simrs-hle",
    "crates/simrs-fuzz",
    "crates/simrs-ota",
    "crates/simrs-pcap",
    "crates/simrs-interposer",
    "crates/simrs-auth-cli",
    "crates/simrs-redact",
    "crates/simrs-secret",
    "crates/simrs-consttime-validation",
    "crates/simrs-profile",
    "crates/simrs-ref",
    "tools/simrs-security-tests",
    "tools/simrs-gp-tests",
    "tools/simrs-jcsl",
    "tools/simrs-differential-tests",
    "tools/jacc",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
# No rust-version field: this workspace requires nightly (see rust-toolchain.toml)

[workspace.dependencies]
# Internal crates (path references keep versions in one place)
simrs-consttime-macros    = { path = "crates/simrs-consttime-macros" }
simrs-consttime           = { path = "crates/simrs-consttime",           default-features = false }
simrs-iso7816             = { path = "crates/simrs-iso7816",             default-features = false }
simrs-card-api            = { path = "crates/simrs-card-api",             default-features = false }
simrs-apdu-schema         = { path = "crates/simrs-apdu-schema" }
simrs-bertlv              = { path = "crates/simrs-bertlv",              default-features = false }
simrs-rijndael            = { path = "crates/simrs-rijndael",            default-features = false }
simrs-comp128             = { path = "crates/simrs-comp128",             default-features = false }
simrs-des                 = { path = "crates/simrs-des",                 default-features = false }
simrs-keccak              = { path = "crates/simrs-keccak",              default-features = false }
simrs-sha256              = { path = "crates/simrs-sha256",              default-features = false }
simrs-sha1                = { path = "crates/simrs-sha1",                default-features = false }
simrs-md5                 = { path = "crates/simrs-md5",                 default-features = false }
simrs-bignum              = { path = "crates/simrs-bignum",              default-features = false }
simrs-rsa                 = { path = "crates/simrs-rsa",                default-features = false }
simrs-iso9797             = { path = "crates/simrs-iso9797",             default-features = false }
simrs-gp-keys             = { path = "crates/simrs-gp-keys",             default-features = false }
simrs-gp-scp              = { path = "crates/simrs-gp-scp",              default-features = false }
simrs-jcre                = { path = "crates/simrs-jcre",                default-features = false }
simrs-jcasm               = { path = "crates/simrs-jcasm" }
simrs-jccompile           = { path = "crates/simrs-jccompile",           default-features = false }
simrs-jcasm-jacc          = { path = "crates/simrs-jcasm-jacc" }
simrs-jcvm                = { path = "crates/simrs-jcvm",                default-features = false }
simrs-gp-open             = { path = "crates/simrs-gp-open",             default-features = false }
simrs-jcop-profile        = { path = "crates/simrs-jcop-profile",         default-features = false }
simrs-gp-card             = { path = "crates/simrs-gp-card",             default-features = false }
simrs-kdf                 = { path = "crates/simrs-kdf",                 default-features = false }
simrs-ecies               = { path = "crates/simrs-ecies",               default-features = false }
simrs-milenage            = { path = "crates/simrs-milenage",            default-features = false }
simrs-tuak                = { path = "crates/simrs-tuak",                default-features = false }
simrs-fs                  = { path = "crates/simrs-fs",                  default-features = false }
simrs-pin                 = { path = "crates/simrs-pin",                 default-features = false }
simrs-proactive           = { path = "crates/simrs-proactive",           default-features = false }
simrs-gsm                 = { path = "crates/simrs-gsm",                 default-features = false }
simrs-usim                = { path = "crates/simrs-usim",                default-features = false }
simrs-sim                 = { path = "crates/simrs-sim",                 default-features = false }
simrs-transport           = { path = "crates/simrs-transport",           default-features = false }
simrs-transport-tcp       = { path = "crates/simrs-transport-tcp" }
simrs-transport-shmem     = { path = "crates/simrs-transport-shmem",     default-features = false }
simrs-transport-virtio    = { path = "crates/simrs-transport-virtio",    default-features = false }
simrs-qemu                = { path = "crates/simrs-qemu" }
simrs-peripheral          = { path = "crates/simrs-peripheral",          default-features = false }
simrs-peripheral-shannon  = { path = "crates/simrs-peripheral-shannon",  default-features = false }
simrs-peripheral-osembed  = { path = "crates/simrs-peripheral-osembed" }
simrs-snapshot            = { path = "crates/simrs-snapshot",            default-features = false }
simrs-hle                 = { path = "crates/simrs-hle" }
simrs-fuzz                = { path = "crates/simrs-fuzz" }
simrs-ota                 = { path = "crates/simrs-ota",                 default-features = false }
simrs-pcap                = { path = "crates/simrs-pcap",                default-features = false }
simrs-interposer          = { path = "crates/simrs-interposer" }
simrs-redact               = { path = "crates/simrs-redact",               default-features = false }
simrs-secret               = { path = "crates/simrs-secret",               default-features = false }
simrs-consttime-validation = { path = "crates/simrs-consttime-validation" }
simrs-profile              = { path = "crates/simrs-profile" }
simrs-ref                  = { path = "crates/simrs-ref" }

# simrs-auth-cli is intentionally absent above -- binary crate, no library target.

# External dependencies
clap       = { version = "4", features = ["derive"] }
getrandom  = "0.2"

# External test/dev dependencies -- tests run on host (std always available)
proptest = "1"
tacet    = "0.4"
cucumber = "0.21"
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }
futures  = "0.3"
insta    = "1"

[workspace.lints.rust]
unsafe_code      = "forbid"
missing_docs     = "warn"
future_incompatible  = { level = "deny", priority = -1 }
nonstandard_style    = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic         = { level = "warn", priority = -1 }
nursery          = { level = "warn", priority = -1 }
# Allow a few pedantic lints that are too noisy for this project
must_use_candidate = "allow"
module_name_repetitions = "allow"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = "debuginfo"

[profile.embedded]
inherits      = "release"
opt-level     = "s"   # size optimized
panic         = "abort"

[profile.bench]
opt-level = 3
lto       = "thin"
debug     = true  # retain symbols for profiling

# nextest CI profile -- referenced by `cargo xtc` alias
[profile.ci]
inherits  = "test"
