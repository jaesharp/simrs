# Open5GS SMF configuration for simrs test network.
#
# Stays on the bundled DNN=internet, but the bundled gradiant config
# points sbi.client.scp at the 5G SCP container which we do not run in
# a pure 4G EPC. Drop the SCP client; SMF only needs PFCP+GTP for 4G.
#
# Reference: https://github.com/open5gs/open5gs/blob/main/configs/open5gs/smf.yaml.in
logger:
  file:
    path: /opt/open5gs/var/log/open5gs/smf.log

global:

smf:
  pfcp:
    server:
    - dev: eth0
    client:
      upf:
      - address: upf
  gtpc:
    server:
    - dev: eth0
  gtpu:
    server:
    - dev: eth0
  metrics:
    server:
    - dev: eth0
      port: 9090
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
      dnn: internet
  dns:
  - 8.8.8.8
  - 8.8.4.4
  mtu: 1400
  ctf:
    enabled: auto
  freeDiameter: /opt/open5gs/etc/freeDiameter/smf.conf
