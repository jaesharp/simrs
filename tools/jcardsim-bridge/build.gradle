// Build script for the simrs-jcardsim bridge JAR.
//
// Produces build/libs/bridge.jar and also copies the resolved jcardsim
// library JAR next to it, so runtime classpath discovery only needs to
// glob one directory.
//
// Usage:
//   ./gradlew --project-dir tools/jcardsim-bridge build
//   -> build/libs/bridge.jar
//   -> build/libs/jcardsim-<version>.jar

plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

repositories {
    // licel publishes jcardsim only to GitHub Packages. Reads from
    // GitHub Packages -- even of public repos -- require a token; see
    // https://docs.github.com/en/packages/learn-github-packages/viewing-packages
    //
    //   Local dev: export GPR_USER=<github-login>  GPR_TOKEN=<PAT with packages:read>
    //   CI:        username=<actor>, password=${{ secrets.GITHUB_TOKEN }}
    //
    // (GITHUB_TOKEN in Actions is a server-generated token with
    // implicit read access to packages of public dependencies.)
    maven {
        url = uri("https://maven.pkg.github.com/licel/jcardsim")
        credentials {
            username = System.getenv("GPR_USER") ?: System.getenv("GITHUB_ACTOR") ?: ""
            password = System.getenv("GPR_TOKEN") ?: System.getenv("GITHUB_TOKEN") ?: ""
        }
    }
    mavenCentral()
}

dependencies {
    // Only version published to the licel/jcardsim package feed as of
    // 2026-04 is '3.0.5-SNAPSHOT' (verified via
    // /users/licel/packages/maven/com.licel.jcardsim/versions).
    implementation 'com.licel:jcardsim:3.0.5-SNAPSHOT'
}

jar {
    archiveFileName = 'bridge.jar'
    manifest {
        attributes 'Main-Class': 'com.simrs.jcardsim.Bridge'
    }
}

// After `jar`, copy the resolved jcardsim JAR into build/libs/ so the
// Rust discovery logic can find it next to bridge.jar.
tasks.register('copyJcardsim', Copy) {
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.find { it.name.startsWith('jcardsim-') }
    }
    into layout.buildDirectory.dir('libs')
}

tasks.named('build') {
    dependsOn 'copyJcardsim'
}
