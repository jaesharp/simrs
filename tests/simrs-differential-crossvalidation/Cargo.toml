[package]
name        = "simrs-differential-crossvalidation"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Differential tests: simrs GpCard vs Oracle jcsl reference simulator"
publish     = false

[dependencies]
simrs-gp-card       = { workspace = true }
simrs-gp-keys       = { workspace = true }
simrs-gp-scp        = { workspace = true }
simrs-card-api      = { workspace = true }
simrs-transport     = { workspace = true }
simrs-interposer    = { workspace = true }
simrs-jcsl          = { path = "../../crates/simrs-jcsl",        optional = true }
simrs-jcardengine   = { path = "../../crates/simrs-jcardengine", optional = true }

[features]
# At least one backend must be enabled to run matrix tests; both are
# enabled by default. CI cells install only the backend their feature
# set activates, so `--no-default-features --features jcsl-backend`
# produces a jcsl-only binary with no JDK/Gradle dependencies.
default             = ["jcsl-backend", "jcardengine-backend"]
jcsl-backend        = ["dep:simrs-jcsl"]
jcardengine-backend = ["dep:simrs-jcardengine"]

[dev-dependencies]
insta = { workspace = true }
simrs-gp-scp       = { workspace = true }
simrs-gp-keys      = { workspace = true }
simrs-controlplane = { path = "../../crates/simrs-controlplane" }

[lints]
workspace = true
