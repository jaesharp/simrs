name: Continuous Test and Integration

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      debug:
        description: "Debug mode: verbose output, preserve intermediates, full artifacts"
        type: boolean
        default: false

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Debug mode enables verbose output and preserves build intermediates in artifacts.
  DEBUG_BUILD: ${{ inputs.debug && 'true' || 'false' }}
  CARGO_TERM_VERBOSE: ${{ inputs.debug && 'true' || 'false' }}
  RUST_BACKTRACE: ${{ inputs.debug && 'full' || '1' }}

jobs:
  # ---- Layer 1: fast checks (no deps) ----

  fmt:
    name: Verify Correct Source Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Verify Rust Code Meets Current Best Practices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  no-std:
    name: "Ensure Core Builds Without Rust Standard Library/Allocator"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - run: >
          cargo check --no-default-features
          -p simrs-rijndael
          -p simrs-des
          -p simrs-sha256
          -p simrs-kdf
          -p simrs-consttime
          -p simrs-bertlv
          -p simrs-iso7816
          -p simrs-fs
          -p simrs-milenage
          -p simrs-tuak
          -p simrs-comp128
          -p simrs-pin
          -p simrs-proactive
          -p simrs-usim
          -p simrs-ecies
          -p simrs-ota
          -p simrs-pcap
          -p simrs-secret
          -p simrs-redact

  # ---- Layer 2: tests (depends on fmt + clippy) ----

  test:
    name: "Test All Components Independently (${{ matrix.artifact-suffix }})"
    needs: [fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact-suffix: linux-aarch64
          - os: macos-15
            artifact-suffix: macos-aarch64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace-${{ matrix.artifact-suffix }}
      # simrs-jcsl transitively depends on the memfd crate (Linux-only
      # syscall), and the Oracle JCDK it wraps is a 32-bit Linux-x86
      # binary -- so exclude the jcsl stack on non-Linux runners.
      - name: Run workspace tests
        shell: bash
        run: |
          EXTRA_EXCLUDES=""
          if [ "${{ runner.os }}" != "Linux" ]; then
            EXTRA_EXCLUDES="--exclude simrs-jcsl --exclude simrs-differential-crossvalidation"
          fi
          cargo test --workspace --exclude simrs-adversarial-countervalidation $EXTRA_EXCLUDES

  sim-card-profiles:
    name: "Validate SIM Card Profiles (${{ matrix.profile.name }}, ${{ matrix.artifact-suffix }})"
    needs: [fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        profile:
          - name: "sim: gsm-only"
            args: "-p simrs-sim --no-default-features --features gsm"
          - name: "sim: usim-only"
            args: "-p simrs-sim --no-default-features --features usim"
          - name: "sim: gsm+usim+gp-applet"
            args: "-p simrs-sim --features gsm,usim,gp-applet"
          - name: "usim: profile-minimal"
            args: "-p simrs-usim --no-default-features --features profile-minimal"
          - name: "usim: profile-full+isim+hpsim+gba"
            args: "-p simrs-usim --features profile-full,isim,hpsim,gba"
          - name: "gp-card: sim"
            args: "-p simrs-gp-card --features sim"
        include:
          - os: ubuntu-24.04
            artifact-suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact-suffix: linux-aarch64
          - os: macos-15
            artifact-suffix: macos-aarch64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: sim-card-profiles-${{ matrix.artifact-suffix }}
      - run: cargo test ${{ matrix.profile.args }}

  security-tests:
    name: "Ensure Adversarial Testing Fails (${{ matrix.artifact-suffix }})"
    needs: [fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact-suffix: linux-aarch64
          - os: macos-15
            artifact-suffix: macos-aarch64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace-${{ matrix.artifact-suffix }}
      - run: cargo test -p simrs-adversarial-countervalidation

  spec-tests:
    name: "Ensure Standards Compliance (${{ matrix.artifact-suffix }})"
    needs: [fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact-suffix: linux-aarch64
          - os: macos-15
            artifact-suffix: macos-aarch64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: tests/simrs-standards-integration-validation
          key: spec-tests-${{ matrix.artifact-suffix }}
      - run: cargo clippy --manifest-path tests/simrs-standards-integration-validation/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path tests/simrs-standards-integration-validation/Cargo.toml --test cucumber

  differential:
    name: "Ensure Functions Like Reference Implementation (Oracle's JavaCard Simulator)"
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: true
      - name: Fetch Oracle JCDK archive (LFS)
        run: cd docs/specs && git lfs pull --include="reference-implementations/java_card_devkit_simulator-linux-bin-*"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace
      - name: Install Oracle JCDK from submodule
        run: |
          ARCHIVE=$(ls docs/specs/reference-implementations/java_card_devkit_simulator-linux-bin-*.tar.gz 2>/dev/null | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "No simulator archive found in submodule -- skipping"
            exit 0
          fi
          # Install 32-bit compatibility libs for the jcsl binary
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6:i386 libstdc++6:i386 zlib1g:i386
          cargo run -p simrs-jcsl -- install "$ARCHIVE"
      - name: Run differential tests
        run: cargo test -p simrs-differential-crossvalidation -- --nocapture
      - name: Run replay tests
        run: cargo test -p simrs-differential-crossvalidation --test replay -- --nocapture
      - name: Generate differential report
        run: cargo test -p simrs-differential-crossvalidation --test report_gen -- --nocapture
      # The JUnit + Markdown reports are uploaded as artifacts below. We do
      # NOT feed them into mikepenz/action-junit-report: that action creates a
      # standalone Check Run attached to the commit SHA, which ends up listed
      # under every workflow that touches the commit (including the unrelated
      # CodeQL scan workflow). `cargo test` already fails the job on any
      # failed test, so the junit-report check was purely decorative.
      - name: Verify report files exist
        run: |
          test -f tests/simrs-differential-crossvalidation/differential-report.xml || { echo "FATAL: JUnit XML report not found"; exit 1; }
          test -f tests/simrs-differential-crossvalidation/differential-report.md || { echo "FATAL: Markdown report not found"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: differential-report
          path: |
            tests/simrs-differential-crossvalidation/differential-report.xml
            tests/simrs-differential-crossvalidation/differential-report.md
          retention-days: 90
          if-no-files-found: error

  # ---- Layer 3: Miri (depends on tests passing) ----

  miri:
    name: "Detect Undefined Usage of Rust Language (${{ matrix.crate }})"
    needs: [test]
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        crate:
          - simrs-consttime
          - simrs-rijndael
          - simrs-des
          - simrs-sha256
          - simrs-kdf
          - simrs-comp128
          - simrs-milenage
          - simrs-bertlv
          - simrs-iso7816
          - simrs-fs
          - simrs-pin
          - simrs-ecies
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Hash crate source
        id: srchash
        run: |
          HASH=$(find crates/ -name '*.rs' -o -name 'Cargo.toml' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Check Miri result cache
        id: miri-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .miri-pass
          key: miri-pass-${{ matrix.crate }}-${{ steps.srchash.outputs.hash }}

      - name: Skip (unchanged)
        if: steps.miri-cache.outputs.cache-hit == 'true'
        run: echo "Miri already passed for this source -- skipping"

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        if: steps.miri-cache.outputs.cache-hit != 'true'
        with:
          toolchain: nightly
          components: miri

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.miri-cache.outputs.cache-hit != 'true'
        with:
          key: miri-${{ matrix.crate }}

      - name: Run Miri
        if: steps.miri-cache.outputs.cache-hit != 'true'
        # `+nightly` overrides the stable pin in rust-toolchain.toml so the
        # miri component (nightly-only) is actually invoked.
        run: >
          MIRIFLAGS="-Zmiri-env-forward=PROPTEST_DISABLE_FAILURE_PERSISTENCE -Zmiri-env-forward=PROPTEST_CASES"
          PROPTEST_DISABLE_FAILURE_PERSISTENCE=1
          PROPTEST_CASES=10
          cargo +nightly miri test -p ${{ matrix.crate }}

      - name: Mark pass
        if: steps.miri-cache.outputs.cache-hit != 'true'
        run: mkdir -p .miri-pass && echo "pass" > .miri-pass/${{ matrix.crate }}

  # ---- Exports pipeline: configure -> compile -> link -> package ----
  #
  # Flow:
  #   test  ->  hle-ffi (matrix on OS)  ->  {java,go,swift,dotnet,python}-bindings
  #        \->  rust-bindings (pure Rust rlib, no capi needed)
  #
  # hle-ffi compiles the C API (cdylib) on each target OS and uploads a
  # prebuilt artifact keyed by OS. Each foreign-language binding downloads
  # the artifact matching its own runner, points build.rs at it via
  # SIMRS_CAPI_PREBUILT_DIR, and compiles the glue layer natively -- all
  # linking dynamically against libsimrs_hle_capi.{so,dylib}. The Rust
  # binding is a pure-Rust LGPL re-export and skips the capi stage.
  #
  # Platform matrix:
  #   ubuntu-24.04     -> linux-x86_64   (.so)
  #   ubuntu-24.04-arm -> linux-aarch64  (.so)
  #   macos-15         -> macos-aarch64  (.dylib)

  rust-bindings:
    name: "Validate Rust Bindings (LGPL re-export, ${{ matrix.toolchain }}, ${{ matrix.artifact-suffix }})"
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, nightly]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        include:
          - os: ubuntu-24.04
            artifact-suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact-suffix: linux-aarch64
          - os: macos-15
            artifact-suffix: macos-aarch64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: exports/simrs-hle-rust
          key: rust-bindings-${{ matrix.toolchain }}-${{ matrix.artifact-suffix }}
      - name: Check formatting
        run: cargo fmt --manifest-path exports/simrs-hle-rust/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --manifest-path exports/simrs-hle-rust/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Build (release)
        run: cargo build --manifest-path exports/simrs-hle-rust/Cargo.toml --release
      - name: Test
        run: cargo test --manifest-path exports/simrs-hle-rust/Cargo.toml --all-features

  hle-ffi:
    name: "Validate C Bindings (${{ matrix.artifact-suffix }})"
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact-suffix: linux-aarch64
          - os: macos-15
            artifact-suffix: macos-aarch64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace-${{ matrix.artifact-suffix }}
      - name: Build cdylib (--release)
        run: cargo build --manifest-path exports/simrs-hle-capi/Cargo.toml --release
      - name: Stage prebuilt outputs
        shell: bash
        env:
          LIB_EXT: ${{ runner.os == 'macOS' && 'dylib' || 'so' }}
        run: |
          mkdir -p capi-prebuilt
          cp "exports/simrs-hle-capi/target/release/libsimrs_hle_capi.$LIB_EXT" capi-prebuilt/
          cp exports/simrs-hle-capi/target/release/build/simrs-hle-capi-*/out/simrs.h capi-prebuilt/
      - name: Upload prebuilt (intermediate for downstream binding jobs)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capi-prebuilt-${{ github.run_id }}-${{ matrix.artifact-suffix }}
          path: capi-prebuilt/
          retention-days: 1
          if-no-files-found: error
      - name: Upload release artifact
        if: env.DEBUG_BUILD != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simrs-hle-capi-${{ matrix.artifact-suffix }}
          path: capi-prebuilt/
          retention-days: 90
          if-no-files-found: error
      - name: Upload debug artifact
        if: env.DEBUG_BUILD == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simrs-hle-capi-${{ matrix.artifact-suffix }}-debug
          path: exports/simrs-hle-capi/target/
          retention-days: 30
          if-no-files-found: error

  python-bindings:
    name: "Validate Python Bindings (Python ${{ matrix.python }}, ${{ matrix.artifact-suffix }})"
    needs: [hle-ffi]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        include:
          - os: ubuntu-24.04
            artifact-suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact-suffix: linux-aarch64
          - os: macos-15
            artifact-suffix: macos-aarch64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace-${{ matrix.artifact-suffix }}
      - name: Download prebuilt capi
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: capi-prebuilt-${{ github.run_id }}-${{ matrix.artifact-suffix }}
          path: ${{ runner.temp }}/capi-prebuilt
      - run: echo "SIMRS_CAPI_PREBUILT_DIR=${{ runner.temp }}/capi-prebuilt" >> $GITHUB_ENV
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true
      - name: Cache Python venv
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: exports/simrs-hle-python/.venv
          key: uv-venv-${{ matrix.artifact-suffix }}-py${{ matrix.python }}-${{ hashFiles('exports/simrs-hle-python/uv.lock') }}
      - run: cargo test --manifest-path exports/simrs-hle-python/Cargo.toml
        env:
          UV_PYTHON: ${{ matrix.python }}
      - name: Build Python wheel
        working-directory: exports/simrs-hle-python
        run: uv build --wheel
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.DEBUG_BUILD != 'true'
        with:
          name: simrs-hle-python-py${{ matrix.python }}-${{ matrix.artifact-suffix }}
          path: exports/simrs-hle-python/dist/*.whl
          retention-days: 90
          if-no-files-found: warn

  java-bindings:
    name: "Validate Java/Kotlin Bindings (JDK ${{ matrix.java }}, ${{ matrix.artifact-suffix }})"
    needs: [hle-ffi]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "21"]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        include:
          - os: ubuntu-24.04
            artifact-suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact-suffix: linux-aarch64
          - os: macos-15
            artifact-suffix: macos-aarch64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace-${{ matrix.artifact-suffix }}
      - name: Download prebuilt capi
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: capi-prebuilt-${{ github.run_id }}-${{ matrix.artifact-suffix }}
          path: ${{ runner.temp }}/capi-prebuilt
      - run: echo "SIMRS_CAPI_PREBUILT_DIR=${{ runner.temp }}/capi-prebuilt" >> $GITHUB_ENV
      - uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Cache jbang
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.jbang
          key: jbang-${{ runner.os }}
      - name: Install jbang
        shell: bash
        run: |
          if [ ! -x "$HOME/.jbang/bin/jbang" ]; then
            curl -Ls https://sh.jbang.dev | bash -s - app setup
          fi
      - name: Cache Kotlin compiler
        id: cache-kotlinc
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/kotlinc
          key: kotlinc-${{ runner.os }}-2.3.20
      - name: Install Kotlin compiler
        if: steps.cache-kotlinc.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -sL https://github.com/JetBrains/kotlin/releases/download/v2.3.20/kotlin-compiler-2.3.20.zip -o /tmp/kotlinc.zip
          unzip -q /tmp/kotlinc.zip -d $HOME/
      - name: Add Kotlin to PATH
        shell: bash
        run: echo "$HOME/kotlinc/bin" >> $GITHUB_PATH
      - name: Run Java/Kotlin tests
        shell: bash
        run: |
          export PATH="$HOME/.jbang/bin:$PATH"
          cargo test --manifest-path exports/simrs-hle-java/Cargo.toml
      - name: Package Java/Kotlin classes into JAR
        shell: bash
        env:
          LIB_EXT: ${{ runner.os == 'macOS' && 'dylib' || 'so' }}
        run: |
          CLASSES_DIR=$(find exports/simrs-hle-java/target -type d -path '*/out/classes' | head -1)
          JNI_LIB=$(find exports/simrs-hle-java/target -name "libsimrs_jni.$LIB_EXT" | head -1)
          mkdir -p dist
          (cd "$CLASSES_DIR" && jar cf "$GITHUB_WORKSPACE/dist/simrs-hle.jar" .)
          cp "$JNI_LIB" dist/
          cp "$SIMRS_CAPI_PREBUILT_DIR/libsimrs_hle_capi.$LIB_EXT" dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.DEBUG_BUILD != 'true'
        with:
          name: simrs-hle-java-jdk${{ matrix.java }}-${{ matrix.artifact-suffix }}
          path: dist/
          retention-days: 90
          if-no-files-found: error

  go-bindings:
    name: "Validate Go Bindings (Go ${{ matrix.go }}, ${{ matrix.artifact-suffix }})"
    needs: [hle-ffi]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.24"]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        include:
          - os: ubuntu-24.04
            artifact-suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact-suffix: linux-aarch64
          - os: macos-15
            artifact-suffix: macos-aarch64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace-${{ matrix.artifact-suffix }}
      - name: Download prebuilt capi
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: capi-prebuilt-${{ github.run_id }}-${{ matrix.artifact-suffix }}
          path: ${{ runner.temp }}/capi-prebuilt
      - run: echo "SIMRS_CAPI_PREBUILT_DIR=${{ runner.temp }}/capi-prebuilt" >> $GITHUB_ENV
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go }}
          # No go.sum -- the binding is pure cgo with no external Go
          # module deps, so there's nothing for the dependency cache to
          # hash. Passing a missing cache-dependency-path makes setup-go
          # emit 'Some specified paths were not resolved'.
          cache: false
      - run: cargo test --manifest-path exports/simrs-hle-go/Cargo.toml
      - name: Package Go bindings
        shell: bash
        env:
          LIB_EXT: ${{ runner.os == 'macOS' && 'dylib' || 'so' }}
        run: |
          mkdir -p dist
          cp exports/simrs-hle-go/{go.mod,simrs.go,simrs_test.go} dist/
          cp "$SIMRS_CAPI_PREBUILT_DIR/simrs.h" dist/
          cp "$SIMRS_CAPI_PREBUILT_DIR/libsimrs_hle_capi.$LIB_EXT" dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.DEBUG_BUILD != 'true'
        with:
          name: simrs-hle-go-go${{ matrix.go }}-${{ matrix.artifact-suffix }}
          path: dist/
          retention-days: 90
          if-no-files-found: error

  dotnet-bindings:
    name: "Validate C#/.NET Bindings (.NET ${{ matrix.dotnet }}, ${{ matrix.artifact-suffix }})"
    needs: [hle-ffi]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        dotnet: ["8.0", "9.0"]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        include:
          - os: ubuntu-24.04
            artifact-suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact-suffix: linux-aarch64
          - os: macos-15
            artifact-suffix: macos-aarch64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace-${{ matrix.artifact-suffix }}
      - name: Download prebuilt capi
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: capi-prebuilt-${{ github.run_id }}-${{ matrix.artifact-suffix }}
          path: ${{ runner.temp }}/capi-prebuilt
      - run: echo "SIMRS_CAPI_PREBUILT_DIR=${{ runner.temp }}/capi-prebuilt" >> $GITHUB_ENV
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.artifact-suffix }}-net${{ matrix.dotnet }}-${{ hashFiles('exports/simrs-hle-dotnet/**/*.csproj') }}
      - run: cargo test --manifest-path exports/simrs-hle-dotnet/Cargo.toml
      - name: Pack NuGet package
        working-directory: exports/simrs-hle-dotnet
        run: dotnet pack SimRS/SimRS.csproj -c Release -o dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.DEBUG_BUILD != 'true'
        with:
          name: simrs-hle-dotnet-net${{ matrix.dotnet }}-${{ matrix.artifact-suffix }}
          path: exports/simrs-hle-dotnet/dist/*.nupkg
          retention-days: 90
          if-no-files-found: warn

  swift-bindings:
    name: "Validate Swift Bindings (Swift ${{ matrix.swift }}, ${{ matrix.artifact-suffix }})"
    needs: [hle-ffi]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # v3 of swift-actions/setup-swift strict-matches the resolved
        # version; requesting '5.10' fails when the toolchain reports as
        # '5.10.1'. Pin to the exact patch release.
        swift: ["5.10.1", "6.1.3"]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        include:
          - os: ubuntu-24.04
            artifact-suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact-suffix: linux-aarch64
          - os: macos-15
            artifact-suffix: macos-aarch64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace-${{ matrix.artifact-suffix }}
      - name: Download prebuilt capi
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: capi-prebuilt-${{ github.run_id }}-${{ matrix.artifact-suffix }}
          path: ${{ runner.temp }}/capi-prebuilt
      - run: echo "SIMRS_CAPI_PREBUILT_DIR=${{ runner.temp }}/capi-prebuilt" >> $GITHUB_ENV
      # swift-actions/setup-swift v3 beta runs `gpg --verify` on the Swift
      # tarball but does not import Swift's signing keyring first, so the
      # GH-hosted runner's empty keyring fails with 'Can't check signature:
      # No public key'. Import Swift's release-signing keyring from the
      # in-repo copy at .github/keys/swift-signing-keys.asc (committed from
      # https://www.swift.org/keys/all-keys.asc so the workflow does not
      # depend on that endpoint being up and serving the same bytes).
      - name: Import Swift PGP signing keys
        if: runner.os != 'macOS'
        shell: bash
        run: gpg --import .github/keys/swift-signing-keys.asc
      # Fork of swift-actions/setup-swift@v3.0.0-beta.1 with only the
      # action.yml 'using: node20' bumped to 'using: node24'; upstream
      # is still Node 20 (Node 20 is deprecated on GH runners). Revert
      # once upstream cuts a Node 24 release.
      - uses: jaesharp/setup-swift@581ce62c7197de0ae71d260b3d654ee68b848cf1 # node24-fix branch
        with:
          swift-version: ${{ matrix.swift }}
      - name: Cache Swift build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: exports/simrs-hle-swift/.build
          key: swift-${{ matrix.artifact-suffix }}-${{ matrix.swift }}-${{ hashFiles('exports/simrs-hle-swift/Package.swift') }}
      - run: cargo test --manifest-path exports/simrs-hle-swift/Cargo.toml
      - name: Package Swift bindings
        shell: bash
        env:
          LIB_EXT: ${{ runner.os == 'macOS' && 'dylib' || 'so' }}
        run: |
          mkdir -p dist
          cp -r exports/simrs-hle-swift/{Package.swift,Sources} dist/
          cp "$SIMRS_CAPI_PREBUILT_DIR/libsimrs_hle_capi.$LIB_EXT" dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.DEBUG_BUILD != 'true'
        with:
          name: simrs-hle-swift-swift${{ matrix.swift }}-${{ matrix.artifact-suffix }}
          path: dist/
          retention-days: 90
          if-no-files-found: error