name: Continuous Test and Integration

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      debug:
        description: "Debug mode: verbose output, preserve intermediates, full artifacts"
        type: boolean
        default: false

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Debug mode enables verbose output and preserves build intermediates in artifacts.
  DEBUG_BUILD: ${{ inputs.debug && 'true' || 'false' }}
  CARGO_TERM_VERBOSE: ${{ inputs.debug && 'true' || 'false' }}
  RUST_BACKTRACE: ${{ inputs.debug && 'full' || '1' }}

jobs:
  # ---- Layer 1: fast checks (no deps) ----

  fmt:
    name: Verify Correct Source Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Verify Rust Code Meets Current Best Practices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  no-std:
    name: "Ensure Core Builds Without Rust Standard Library/Allocator"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - run: >
          cargo check --no-default-features
          -p simrs-rijndael
          -p simrs-des
          -p simrs-sha256
          -p simrs-kdf
          -p simrs-consttime
          -p simrs-bertlv
          -p simrs-iso7816
          -p simrs-fs
          -p simrs-milenage
          -p simrs-tuak
          -p simrs-comp128
          -p simrs-pin
          -p simrs-proactive
          -p simrs-usim
          -p simrs-ecies
          -p simrs-ota
          -p simrs-pcap
          -p simrs-secret
          -p simrs-redact

  # ---- Layer 2: tests (depends on fmt + clippy) ----

  test:
    name: Test All Components Independently
    needs: [fmt, clippy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace
      - run: cargo test --workspace --exclude simrs-adversarial-countervalidation

  sim-card-profiles:
    name: "Validate SIM Card Profiles (${{ matrix.name }})"
    needs: [fmt, clippy]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "sim: gsm-only"
            args: "-p simrs-sim --no-default-features --features gsm"
          - name: "sim: usim-only"
            args: "-p simrs-sim --no-default-features --features usim"
          - name: "sim: gsm+usim+gp-applet"
            args: "-p simrs-sim --features gsm,usim,gp-applet"
          - name: "usim: profile-minimal"
            args: "-p simrs-usim --no-default-features --features profile-minimal"
          - name: "usim: profile-full+isim+hpsim+gba"
            args: "-p simrs-usim --features profile-full,isim,hpsim,gba"
          - name: "gp-card: sim"
            args: "-p simrs-gp-card --features sim"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test ${{ matrix.args }}

  security-tests:
    name: Ensure Adversarial Testing Fails
    needs: [fmt, clippy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace
      - run: cargo test -p simrs-adversarial-countervalidation

  spec-tests:
    name: Ensure Standards Compliance
    needs: [fmt, clippy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: tests/simrs-standards-integration-validation
      - run: cargo clippy --manifest-path tests/simrs-standards-integration-validation/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path tests/simrs-standards-integration-validation/Cargo.toml --test cucumber

  differential:
    name: "Ensure Functions Like Reference Implementation (Oracle's JavaCard Simulator)"
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: true
      - name: Fetch Oracle JCDK archive (LFS)
        run: cd docs/specs && git lfs pull --include="reference-implementations/java_card_devkit_simulator-linux-bin-*"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace
      - name: Install Oracle JCDK from submodule
        run: |
          ARCHIVE=$(ls docs/specs/reference-implementations/java_card_devkit_simulator-linux-bin-*.tar.gz 2>/dev/null | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "No simulator archive found in submodule -- skipping"
            exit 0
          fi
          # Install 32-bit compatibility libs for the jcsl binary
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6:i386 libstdc++6:i386 zlib1g:i386
          cargo run -p simrs-jcsl -- install "$ARCHIVE"
      - name: Run differential tests
        run: cargo test -p simrs-differential-crossvalidation -- --nocapture
      - name: Run replay tests
        run: cargo test -p simrs-differential-crossvalidation --test replay -- --nocapture
      - name: Generate differential report
        run: cargo test -p simrs-differential-crossvalidation --test report_gen -- --nocapture
      # The JUnit + Markdown reports are uploaded as artifacts below. We do
      # NOT feed them into mikepenz/action-junit-report: that action creates a
      # standalone Check Run attached to the commit SHA, which ends up listed
      # under every workflow that touches the commit (including the unrelated
      # CodeQL scan workflow). `cargo test` already fails the job on any
      # failed test, so the junit-report check was purely decorative.
      - name: Verify report files exist
        run: |
          test -f tests/simrs-differential-crossvalidation/differential-report.xml || { echo "FATAL: JUnit XML report not found"; exit 1; }
          test -f tests/simrs-differential-crossvalidation/differential-report.md || { echo "FATAL: Markdown report not found"; exit 1; }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: differential-report
          path: |
            tests/simrs-differential-crossvalidation/differential-report.xml
            tests/simrs-differential-crossvalidation/differential-report.md
          retention-days: 90
          if-no-files-found: error

  # ---- Layer 3: Miri (depends on tests passing) ----

  miri:
    name: "Detect Undefined Usage of Rust Language (${{ matrix.crate }})"
    needs: [test]
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        crate:
          - simrs-consttime
          - simrs-rijndael
          - simrs-des
          - simrs-sha256
          - simrs-kdf
          - simrs-comp128
          - simrs-milenage
          - simrs-bertlv
          - simrs-iso7816
          - simrs-fs
          - simrs-pin
          - simrs-ecies
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Hash crate source
        id: srchash
        run: |
          HASH=$(find crates/ -name '*.rs' -o -name 'Cargo.toml' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Check Miri result cache
        id: miri-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .miri-pass
          key: miri-pass-${{ matrix.crate }}-${{ steps.srchash.outputs.hash }}

      - name: Skip (unchanged)
        if: steps.miri-cache.outputs.cache-hit == 'true'
        run: echo "Miri already passed for this source -- skipping"

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        if: steps.miri-cache.outputs.cache-hit != 'true'
        with:
          toolchain: nightly
          components: miri

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.miri-cache.outputs.cache-hit != 'true'
        with:
          key: miri-${{ matrix.crate }}

      - name: Run Miri
        if: steps.miri-cache.outputs.cache-hit != 'true'
        # `+nightly` overrides the stable pin in rust-toolchain.toml so the
        # miri component (nightly-only) is actually invoked.
        run: >
          MIRIFLAGS="-Zmiri-env-forward=PROPTEST_DISABLE_FAILURE_PERSISTENCE -Zmiri-env-forward=PROPTEST_CASES"
          PROPTEST_DISABLE_FAILURE_PERSISTENCE=1
          PROPTEST_CASES=10
          cargo +nightly miri test -p ${{ matrix.crate }}

      - name: Mark pass
        if: steps.miri-cache.outputs.cache-hit != 'true'
        run: mkdir -p .miri-pass && echo "pass" > .miri-pass/${{ matrix.crate }}

  # ---- Exports pipeline: configure -> compile -> link -> package ----
  #
  # Flow:
  #   test  ->  hle-ffi  ->  {java,go,swift,dotnet,python}-bindings
  #        \->  rust-bindings (pure Rust rlib, no capi needed)
  #
  # hle-ffi compiles the C API (cdylib + staticlib) once. Each downstream
  # foreign-language binding downloads the prebuilt artifact, points
  # build.rs at it via SIMRS_CAPI_PREBUILT_DIR, and only compiles the small
  # glue layer. SIMRS_CAPI_LINKAGE drives dynamic vs static linking for
  # java/go/swift. Python and .NET are dynamic-only (ctypes / P/Invoke load
  # .so at runtime). The Rust binding is a pure-Rust LGPL re-export of
  # simrs-hle and doesn't involve the C API, so it skips the capi stage.

  rust-bindings:
    name: "Validate Rust Bindings (LGPL re-export, ${{ matrix.toolchain }})"
    needs: [test]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: exports/simrs-hle-rust
          key: rust-bindings-${{ matrix.toolchain }}
      - name: Check formatting
        run: cargo fmt --manifest-path exports/simrs-hle-rust/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --manifest-path exports/simrs-hle-rust/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Build (release)
        run: cargo build --manifest-path exports/simrs-hle-rust/Cargo.toml --release
      - name: Test
        run: cargo test --manifest-path exports/simrs-hle-rust/Cargo.toml --all-features

  hle-ffi:
    name: Validate C Bindings (dynamic + static)
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace
      - name: Build cdylib + staticlib (--release)
        run: cargo build --manifest-path exports/simrs-hle-capi/Cargo.toml --release
      - name: Stage prebuilt outputs (.so, .a, .h)
        run: |
          mkdir -p capi-prebuilt
          cp exports/simrs-hle-capi/target/release/libsimrs_hle_capi.so capi-prebuilt/
          cp exports/simrs-hle-capi/target/release/libsimrs_hle_capi.a  capi-prebuilt/
          cp exports/simrs-hle-capi/target/release/build/simrs-hle-capi-*/out/simrs.h capi-prebuilt/
      - name: Upload prebuilt (intermediate for downstream binding jobs)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: capi-prebuilt-${{ github.run_id }}
          path: capi-prebuilt/
          retention-days: 1
          if-no-files-found: error
      - name: Upload release (dynamic)
        if: env.DEBUG_BUILD != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: simrs-hle-capi-linux-x86_64-dynamic
          path: |
            capi-prebuilt/libsimrs_hle_capi.so
            capi-prebuilt/simrs.h
          retention-days: 90
          if-no-files-found: error
      - name: Upload release (static)
        if: env.DEBUG_BUILD != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: simrs-hle-capi-linux-x86_64-static
          path: |
            capi-prebuilt/libsimrs_hle_capi.a
            capi-prebuilt/simrs.h
          retention-days: 90
          if-no-files-found: error
      - name: Upload debug artifact
        if: env.DEBUG_BUILD == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: simrs-hle-capi-linux-x86_64-debug
          path: exports/simrs-hle-capi/target/
          retention-days: 30
          if-no-files-found: error

  python-bindings:
    name: "Validate Python Bindings (Python ${{ matrix.python }})"
    needs: [hle-ffi]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    env:
      SIMRS_CAPI_LINKAGE: dynamic
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace
      - name: Download prebuilt capi
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v6
        with:
          name: capi-prebuilt-${{ github.run_id }}
          path: ${{ runner.temp }}/capi-prebuilt
      - run: echo "SIMRS_CAPI_PREBUILT_DIR=${{ runner.temp }}/capi-prebuilt" >> $GITHUB_ENV
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true
      - name: Cache Python venv
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: exports/simrs-hle-python/.venv
          key: uv-venv-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('exports/simrs-hle-python/uv.lock') }}
      - run: cargo test --manifest-path exports/simrs-hle-python/Cargo.toml
        env:
          UV_PYTHON: ${{ matrix.python }}
      - name: Build Python wheel
        working-directory: exports/simrs-hle-python
        run: uv build --wheel
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: env.DEBUG_BUILD != 'true'
        with:
          name: simrs-hle-python-py${{ matrix.python }}
          path: exports/simrs-hle-python/dist/*.whl
          retention-days: 90
          if-no-files-found: warn

  java-bindings:
    name: "Validate Java/Kotlin Bindings (JDK ${{ matrix.java }}, ${{ matrix.linkage }})"
    needs: [hle-ffi]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "21"]
        linkage: [dynamic, static]
    env:
      SIMRS_CAPI_LINKAGE: ${{ matrix.linkage }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace
      - name: Download prebuilt capi
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v6
        with:
          name: capi-prebuilt-${{ github.run_id }}
          path: ${{ runner.temp }}/capi-prebuilt
      - run: echo "SIMRS_CAPI_PREBUILT_DIR=${{ runner.temp }}/capi-prebuilt" >> $GITHUB_ENV
      - uses: actions/setup-java@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Cache jbang
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.jbang
          key: jbang-${{ runner.os }}
      - name: Install jbang
        run: |
          if [ ! -x "$HOME/.jbang/bin/jbang" ]; then
            curl -Ls https://sh.jbang.dev | bash -s - app setup
          fi
      - name: Cache Kotlin compiler
        id: cache-kotlinc
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/kotlinc
          key: kotlinc-${{ runner.os }}-2.3.20
      - name: Install Kotlin compiler
        if: steps.cache-kotlinc.outputs.cache-hit != 'true'
        run: |
          curl -sL https://github.com/JetBrains/kotlin/releases/download/v2.3.20/kotlin-compiler-2.3.20.zip -o /tmp/kotlinc.zip
          unzip -q /tmp/kotlinc.zip -d $HOME/
      - name: Add Kotlin to PATH
        run: echo "$HOME/kotlinc/bin" >> $GITHUB_PATH
      - run: export PATH="$HOME/.jbang/bin:$PATH" && cargo test --manifest-path exports/simrs-hle-java/Cargo.toml
      - name: Package Java/Kotlin classes into JAR
        run: |
          CLASSES_DIR=$(find exports/simrs-hle-java/target -type d -path '*/out/classes' | head -1)
          JNI_SO=$(find exports/simrs-hle-java/target -name 'libsimrs_jni.so' | head -1)
          mkdir -p dist
          (cd "$CLASSES_DIR" && jar cf "$GITHUB_WORKSPACE/dist/simrs-hle.jar" .)
          cp "$JNI_SO" dist/
          if [ "${{ matrix.linkage }}" = "dynamic" ]; then
            cp "$SIMRS_CAPI_PREBUILT_DIR/libsimrs_hle_capi.so" dist/
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: env.DEBUG_BUILD != 'true'
        with:
          name: simrs-hle-java-jdk${{ matrix.java }}-${{ matrix.linkage }}
          path: dist/
          retention-days: 90
          if-no-files-found: error

  go-bindings:
    name: "Validate Go Bindings (Go ${{ matrix.go }}, ${{ matrix.linkage }})"
    needs: [hle-ffi]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.24"]
        linkage: [dynamic, static]
    env:
      SIMRS_CAPI_LINKAGE: ${{ matrix.linkage }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace
      - name: Download prebuilt capi
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v6
        with:
          name: capi-prebuilt-${{ github.run_id }}
          path: ${{ runner.temp }}/capi-prebuilt
      - run: echo "SIMRS_CAPI_PREBUILT_DIR=${{ runner.temp }}/capi-prebuilt" >> $GITHUB_ENV
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: exports/simrs-hle-go/go.sum
      - run: cargo test --manifest-path exports/simrs-hle-go/Cargo.toml
      - name: Package Go bindings
        run: |
          mkdir -p dist
          cp exports/simrs-hle-go/{go.mod,simrs.go,simrs_test.go} dist/
          cp "$SIMRS_CAPI_PREBUILT_DIR/simrs.h" dist/
          if [ "${{ matrix.linkage }}" = "dynamic" ]; then
            cp "$SIMRS_CAPI_PREBUILT_DIR/libsimrs_hle_capi.so" dist/
          else
            cp "$SIMRS_CAPI_PREBUILT_DIR/libsimrs_hle_capi.a" dist/
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: env.DEBUG_BUILD != 'true'
        with:
          name: simrs-hle-go-go${{ matrix.go }}-${{ matrix.linkage }}
          path: dist/
          retention-days: 90
          if-no-files-found: error

  dotnet-bindings:
    name: "Validate C#/.NET Bindings (.NET ${{ matrix.dotnet }})"
    needs: [hle-ffi]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dotnet: ["8.0", "9.0"]
    env:
      SIMRS_CAPI_LINKAGE: dynamic
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace
      - name: Download prebuilt capi
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v6
        with:
          name: capi-prebuilt-${{ github.run_id }}
          path: ${{ runner.temp }}/capi-prebuilt
      - run: echo "SIMRS_CAPI_PREBUILT_DIR=${{ runner.temp }}/capi-prebuilt" >> $GITHUB_ENV
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-net${{ matrix.dotnet }}-${{ hashFiles('exports/simrs-hle-dotnet/**/*.csproj') }}
      - run: cargo test --manifest-path exports/simrs-hle-dotnet/Cargo.toml
      - name: Pack NuGet package
        working-directory: exports/simrs-hle-dotnet
        run: dotnet pack SimRS/SimRS.csproj -c Release -o dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: env.DEBUG_BUILD != 'true'
        with:
          name: simrs-hle-dotnet-net${{ matrix.dotnet }}
          path: exports/simrs-hle-dotnet/dist/*.nupkg
          retention-days: 90
          if-no-files-found: warn

  swift-bindings:
    name: "Validate Swift Bindings (Swift ${{ matrix.swift }}, ${{ matrix.linkage }})"
    needs: [hle-ffi]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        swift: ["5.10", "6.1"]
        linkage: [dynamic, static]
    env:
      SIMRS_CAPI_LINKAGE: ${{ matrix.linkage }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace
      - name: Download prebuilt capi
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v6
        with:
          name: capi-prebuilt-${{ github.run_id }}
          path: ${{ runner.temp }}/capi-prebuilt
      - run: echo "SIMRS_CAPI_PREBUILT_DIR=${{ runner.temp }}/capi-prebuilt" >> $GITHUB_ENV
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: ${{ matrix.swift }}
      - name: Cache Swift build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: exports/simrs-hle-swift/.build
          key: swift-${{ runner.os }}-${{ matrix.swift }}-${{ matrix.linkage }}-${{ hashFiles('exports/simrs-hle-swift/Package.swift') }}
      - run: cargo test --manifest-path exports/simrs-hle-swift/Cargo.toml
      - name: Package Swift bindings
        run: |
          mkdir -p dist
          cp -r exports/simrs-hle-swift/{Package.swift,Sources} dist/
          if [ "${{ matrix.linkage }}" = "dynamic" ]; then
            cp "$SIMRS_CAPI_PREBUILT_DIR/libsimrs_hle_capi.so" dist/
          else
            cp "$SIMRS_CAPI_PREBUILT_DIR/libsimrs_hle_capi.a" dist/
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: env.DEBUG_BUILD != 'true'
        with:
          name: simrs-hle-swift-swift${{ matrix.swift }}-${{ matrix.linkage }}
          path: dist/
          retention-days: 90
          if-no-files-found: error