name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---- Layer 1: fast checks (no deps) ----

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  no-std:
    name: Verify no_std Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - run: >
          cargo check --no-default-features
          -p simrs-rijndael
          -p simrs-des
          -p simrs-sha256
          -p simrs-kdf
          -p simrs-consttime
          -p simrs-bertlv
          -p simrs-iso7816
          -p simrs-fs
          -p simrs-milenage
          -p simrs-tuak
          -p simrs-comp128
          -p simrs-pin
          -p simrs-proactive
          -p simrs-usim
          -p simrs-ecies
          -p simrs-ota
          -p simrs-pcap
          -p simrs-secret
          -p simrs-redact

  # ---- Layer 2: tests (depends on fmt + clippy) ----

  test:
    name: Test
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - run: cargo test --workspace --exclude simrs-security-tests

  test-features:
    name: Test (${{ matrix.name }})
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "sim: gsm-only"
            args: "-p simrs-sim --no-default-features --features gsm"
          - name: "sim: usim-only"
            args: "-p simrs-sim --no-default-features --features usim"
          - name: "sim: gsm+usim+gp-applet"
            args: "-p simrs-sim --features gsm,usim,gp-applet"
          - name: "usim: profile-minimal"
            args: "-p simrs-usim --no-default-features --features profile-minimal"
          - name: "usim: profile-full+isim+hpsim+gba"
            args: "-p simrs-usim --features profile-full,isim,hpsim,gba"
          - name: "gp-card: sim"
            args: "-p simrs-gp-card --features sim"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.args }}

  security-tests:
    name: Security tests
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - run: cargo test -p simrs-security-tests

  spec-tests:
    name: Spec tests
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/simrs-spec-tests
      - run: cargo clippy --manifest-path tools/simrs-spec-tests/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path tools/simrs-spec-tests/Cargo.toml --test cucumber

  differential:
    name: Differential (Oracle JCVM)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Fetch Oracle JCDK archive (LFS)
        run: cd docs/specs && git lfs pull --include="reference-implementations/java_card_devkit_simulator-linux-bin-*"
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - name: Install Oracle JCDK from submodule
        run: |
          ARCHIVE=$(ls docs/specs/reference-implementations/java_card_devkit_simulator-linux-bin-*.tar.gz 2>/dev/null | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "No simulator archive found in submodule -- skipping"
            exit 0
          fi
          # Install 32-bit compatibility libs for the jcsl binary
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6:i386 libstdc++6:i386 zlib1g:i386
          cargo run -p simrs-jcsl -- install "$ARCHIVE"
      - name: Run differential tests
        run: cargo test -p simrs-differential-tests -- --nocapture
      - name: Run replay tests
        run: cargo test -p simrs-differential-tests --test replay -- --nocapture
      - name: Generate differential report
        run: cargo test -p simrs-differential-tests --test report_gen -- --nocapture
      - name: Publish JUnit report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: differential-report.xml
          check_name: Differential Compliance
          include_passed: true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: differential-report
          path: |
            differential-report.xml
            differential-report.md
          retention-days: 90

  # ---- Layer 3: Miri (depends on tests passing) ----

  miri:
    name: Miri (${{ matrix.crate }})
    needs: [test]
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        crate:
          - simrs-consttime
          - simrs-rijndael
          - simrs-des
          - simrs-sha256
          - simrs-kdf
          - simrs-comp128
          - simrs-milenage
          - simrs-bertlv
          - simrs-iso7816
          - simrs-fs
          - simrs-pin
          - simrs-ecies
    steps:
      - uses: actions/checkout@v6

      - name: Hash crate source
        id: srchash
        run: |
          HASH=$(find crates/ -name '*.rs' -o -name 'Cargo.toml' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Check Miri result cache
        id: miri-cache
        uses: actions/cache@v5
        with:
          path: .miri-pass
          key: miri-pass-${{ matrix.crate }}-${{ steps.srchash.outputs.hash }}

      - name: Skip (unchanged)
        if: steps.miri-cache.outputs.cache-hit == 'true'
        run: echo "Miri already passed for this source -- skipping"

      - uses: dtolnay/rust-toolchain@nightly
        if: steps.miri-cache.outputs.cache-hit != 'true'
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2
        if: steps.miri-cache.outputs.cache-hit != 'true'
        with:
          key: miri-${{ matrix.crate }}

      - name: Run Miri
        if: steps.miri-cache.outputs.cache-hit != 'true'
        run: >
          MIRIFLAGS="-Zmiri-env-forward=PROPTEST_DISABLE_FAILURE_PERSISTENCE -Zmiri-env-forward=PROPTEST_CASES"
          PROPTEST_DISABLE_FAILURE_PERSISTENCE=1
          PROPTEST_CASES=10
          cargo miri test -p ${{ matrix.crate }}

      - name: Mark pass
        if: steps.miri-cache.outputs.cache-hit != 'true'
        run: mkdir -p .miri-pass && echo "pass" > .miri-pass/${{ matrix.crate }}

  # ---- Layer 2 (parallel): build artifacts ----

  hle-ffi:
    name: HLE FFI cdylib
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - run: cargo build --manifest-path tools/simrs-hle-ffi/Cargo.toml --release
