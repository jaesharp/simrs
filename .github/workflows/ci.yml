name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude simrs-security-tests

  security-tests:
    name: Security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p simrs-security-tests

  spec-tests:
    name: Spec tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/simrs-spec-tests
      - run: cargo clippy --manifest-path tools/simrs-spec-tests/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path tools/simrs-spec-tests/Cargo.toml --test cucumber

  miri:
    name: Miri
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: >
          MIRIFLAGS="-Zmiri-env-forward=PROPTEST_DISABLE_FAILURE_PERSISTENCE"
          PROPTEST_DISABLE_FAILURE_PERSISTENCE=1
          cargo miri test
          -p simrs-consttime
          -p simrs-rijndael
          -p simrs-des
          -p simrs-sha256
          -p simrs-kdf
          -p simrs-comp128
          -p simrs-milenage
          -p simrs-bertlv
          -p simrs-iso7816
          -p simrs-fs
          -p simrs-pin
          -p simrs-ecies

  no-std:
    name: no_std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: >
          cargo check --no-default-features
          -p simrs-rijndael
          -p simrs-des
          -p simrs-sha256
          -p simrs-kdf
          -p simrs-consttime
          -p simrs-bertlv
          -p simrs-iso7816
          -p simrs-fs
          -p simrs-milenage
          -p simrs-tuak
          -p simrs-comp128
          -p simrs-pin
          -p simrs-proactive
          -p simrs-usim
          -p simrs-ecies
          -p simrs-ota
          -p simrs-pcap
          -p simrs-secret
          -p simrs-redact

  hle-ffi:
    name: HLE FFI cdylib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --manifest-path tools/simrs-hle-ffi/Cargo.toml --release

  consttime:
    name: Constant-time validation
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p simrs-consttime-validation --release
      - run: cargo test --workspace --features ct-validation --release -- ct_validation
