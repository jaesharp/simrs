name: Constant-Time Validation

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  consttime:
    name: tacet timing analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Validation framework
        run: cargo test -p simrs-consttime-validation --release
      - name: Per-crate CT tests
        run: cargo test --workspace --features ct-validation --release -- ct_validation
