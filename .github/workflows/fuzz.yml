name: Fuzz

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Fuzz iterations'
        default: '10000'

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Structure-aware APDU fuzzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Run fuzzer
        run: >
          SIMRS_FUZZ_ITERS=${{ inputs.iterations || '10000' }}
          SIMRS_FUZZ_PCAP=fuzz-output.pcap
          cargo run -p simrs-fuzz --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-pcap
          path: fuzz-output.pcap
          retention-days: 30
